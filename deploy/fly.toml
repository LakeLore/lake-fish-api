app = 'lake-fish-api'
primary_region = 'ord'   # Chicago — central for SD/MN/ND/IA/NE

[build]

[env]
  NODE_ENV = 'production'
  # Ask LakeLore (production launch with app 1.1.2, 2026-10-20). Needs the
  # ANTHROPIC_API_KEY secret (a key from the Console org linked to the Max
  # plan's monthly credit) or every ask 503s ask_unconfigured. Subscribers
  # only in every state (server.js), so the route is public to the app: the
  # X-Ask-Token gate exists for free-state asks, which production refuses.
  # Limits (owner decision 2026-10-27): 15 asks per subscriber per UTC day
  # (counted per machine, so up to 30 when both machines serve one user —
  # ASK-07). No whole-app daily ceiling and no per-IP hourly limit; both are
  # still available as levers (LAKELORE_ASK_DAILY_MAX / LAKELORE_ASK_PER_HOUR,
  # RUNBOOK §20). The owner's test devices are exempt from the daily cap via
  # the LAKELORE_ASK_UNLIMITED_USERS secret (user ids — never put them here,
  # this repo is public). The hard stop on spend is the Console workspace
  # spend limit and the monthly credit (RUNBOOK §20). Counts survive restarts
  # (/data/ask-counts.json).
  LAKELORE_ASK_ENABLED = '1'
  LAKELORE_ASK_PUBLIC = '1'
  LAKELORE_ASK_USER_DAILY_MAX = '15'

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1   # keep one machine warm; avoids cold-start on first request

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/healthz'
    timeout = '10s'

# Persistent volume for all state databases and NE PDFs.
# Upload/update databases here without rebuilding the Docker image.
# Add new states: upload the .db file and set a new *_DB_PATH env var.
[[mounts]]
  source = 'lake_fish_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
